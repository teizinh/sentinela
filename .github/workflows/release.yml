name: Release Sentinela

"on":
  push:
    tags: ['v*']
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag existente a compilar (igual a v + versão do Cargo.toml)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.release.tag_name || inputs.tag_name || github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            asset: sentinela-linux-x86_64
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            asset: sentinela-linux-arm64
          - os: macos-15-intel
            target: x86_64-apple-darwin
            asset: sentinela-macos-x86_64
          - os: macos-15
            target: aarch64-apple-darwin
            asset: sentinela-macos-arm64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset: sentinela-windows-x64
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag_name || github.ref }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: Validate release version
        id: version
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag_name || github.ref_name }}
        run: |
          VERSION=$(cargo metadata --no-deps --format-version 1 | python -c 'import json,sys; print(json.load(sys.stdin)["packages"][0]["version"])')
          if [ "$RELEASE_TAG" != "v$VERSION" ]; then
            echo "::error::Tag $RELEASE_TAG does not match Cargo.toml v$VERSION"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Test
        run: cargo test --locked --target ${{ matrix.target }}
      - name: Build release binary
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Test mobile terminal
        if: runner.os == 'Linux'
        env:
          SENTINELA_TEST_BINARY: ${{ github.workspace }}/target/${{ matrix.target }}/release/sentinela
        run: python3 scripts/test-mobile.py
      - name: Install Linux packaging tools
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y alien dpkg-dev
      - name: Package Unix assets
        if: runner.os != 'Windows'
        env:
          TARGET: ${{ matrix.target }}
          ASSET: ${{ matrix.asset }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          bash scripts/package-linux.sh "target/$TARGET/release/sentinela" "$TARGET" "$ASSET" "$VERSION"
          test -f "$ASSET.tar.gz"
          if [ "$RUNNER_OS" = "Linux" ]; then test -f "$ASSET.deb"; fi
          if [ "$TARGET" = "x86_64-unknown-linux-gnu" ]; then test -f "$ASSET.rpm"; fi
      - if: runner.os == 'Windows'
        name: Package Windows Assets (Zip & NSIS Setup)
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          Copy-Item "target/x86_64-pc-windows-msvc/release/sentinela.exe" -Destination dist/
          Copy-Item "scripts/install.ps1" -Destination dist/
          Copy-Item "scripts/install.bat" -Destination dist/
          Copy-Item "README.md" -Destination dist/
          Copy-Item "LICENSE" -Destination dist/

          # 1. Zip Portatil
          Compress-Archive -Path dist/* -DestinationPath "sentinela-windows-x64.zip" -Force
          $hashZip = (Get-FileHash -Algorithm SHA256 "sentinela-windows-x64.zip").Hash.ToLower()
          "$hashZip  sentinela-windows-x64.zip" | Out-File -Encoding ascii "sentinela-windows-x64.zip.sha256"

          # 2. Instalador Grafico Oficial NSIS (Setup Wizard)
          choco install -y nsis
          if ($LASTEXITCODE -ne 0) { throw "NSIS installation failed" }
          $makensisPath = "C:\Program Files (x86)\NSIS\makensis.exe"
          if (-not (Test-Path $makensisPath)) {
            $makensisPath = "makensis"
          }
          & $makensisPath "/DVERSION=$env:VERSION" scripts/installer.nsi
          if ($LASTEXITCODE -ne 0) { throw "NSIS packaging failed" }
          $setupExe = "sentinela-windows-x64-setup.exe"
          $hashSetup = (Get-FileHash -Algorithm SHA256 $setupExe).Hash.ToLower()
          "$hashSetup  $setupExe" | Out-File -Encoding ascii "$setupExe.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          if-no-files-found: error
          path: |
            *.tar.gz
            *.deb
            *.rpm
            *.zip
            *-setup.exe
            *.sha256

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Verify and combine checksums
        working-directory: release-assets
        run: |
          cat *.sha256 > SHA256SUMS.txt
          sha256sum --check SHA256SUMS.txt
          rm -- *.sha256
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name || inputs.tag_name || github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: release-assets/*
